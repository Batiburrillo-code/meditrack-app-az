apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: meditrack-api }
  template:
    metadata:
      labels: { app: meditrack-api }
    spec:
      containers:
        - name: meditrack-api
          image: acrdevopsfinalas2.azurecr.io/meditrack-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: meditrack-db
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
